services:
  mysql:
    image: mysql:8.0
    container_name: safesignal-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_local_dev
      MYSQL_DATABASE: safesignal
      MYSQL_USER: safesignal_user
      MYSQL_PASSWORD: safesignal_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Optional local S3-compatible object storage
  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: safesignal-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:
